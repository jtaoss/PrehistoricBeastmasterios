# Include inside the EXISTING HTTPS server block. Change the URL prefix and
# filesystem root together with MINI_GAME_REMOTE_BASE_URL before enabling iOS.
location ^~ /emberwild/current/ {
    alias /srv/emberwild/current/;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    autoindex off;
    # current changes atomically; every resource revalidates after a release.
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    limit_except GET HEAD { deny all; }
}
